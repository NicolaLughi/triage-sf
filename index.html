<header><div class="wrap"><h1>Triage – Semestre Filtro</h1><nav id="nav" aria-label="Sezioni"></nav></div></header>
<main id="main"></main>
<script id="motore">/* motore_f4a.js - Motore di calcolo dell'app (F4-a, 27/10/2026)
 *
 * Porting in JavaScript delle funzioni di riferimento Python:
 *   - claude/SCRIPT_F3b.md, Codice 2 (riferimento_app_f3b.py): c_min, bb_pmf, bin_pmf, conv, p_supera,
 *     quote_attese, raccomanda, wilson, etichetta_unita
 *   - claude/SCRIPT_F3c.md (tempo_f3c.py): budget_s, checkpoint, limite_morbido_s, proiezione, ranghi_mediana,
 *     mediana_ic, p_supera (gruppi), p_non_letti_peggiori, p_non_letti_casuali, normalizza, corretta_rigorosa
 *   - claude/SPEC_F4.md §5.4 (esame: P(3 su 3), P(>= 2 su 3)) e §6 (misura del tempo)
 *
 * Regole d'esame: DM 941 art. 7 c.3, art. 8 c.1 e c.3; Allegato 2 punti 4 e 6.
 * Nessuna interfaccia, nessun dataset, nessuna dipendenza, nessun accesso a rete/storage.
 * Un solo file: funziona in Node (CommonJS) e nel browser (globale MotoreF4).
 * Requisiti: BigInt (Chrome 67+, Safari 14+), String.prototype.normalize, ES2019.
 *
 * Nomi delle funzioni = nomi del riferimento Python (snake_case), per poter confrontare riga per riga.
 * Differenze di forma rispetto a Python (stessi valori numerici):
 *   - le tuple Python diventano array o oggetti con campi nominati (vedi commenti);
 *   - 'scenari' di raccomanda() e' un ARRAY ordinato (le chiavi float di un dizionario non sono portabili);
 *   - etichetta_unita() restituisce {codice, testo}: il codice e' stabile, il testo e' quello di SPEC_F4 §5.2
 *     (con gli accenti; il riferimento Python usa una versione ASCII del testo).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.MotoreF4 = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ------------------------------------------------------------------ costanti
  const SOGLIA = 25;               // risposte minime per livello e per unita' (D4a, Q22) [decisione utente]
  const PRIOR_A = 0.5, PRIOR_B = 0.5;   // prior di Jeffreys per ogni livello [scelta di Claude, F3 passo 2]
  const RIF_MIN = 100;             // risposte minime nel riferimento per etichettare un'unita' [EURISTICA]
  const Z95 = 1.959963984540054, Z99 = 2.5758293035489004;
  const SCENARI = [0.0, -0.05, -0.10];  // spostamenti additivi delle p (robustezza) [EURISTICA]
  const LIVELLI = ['A', 'M', 'B'];      // ordine nominale: Alta, Media, Bassa
  const TEMPO_S = 50 * 60;              // DM 941 art. 7 c.3
  const NQ = 31, NC = 21, NM = 10;      // Allegato 2 punto 4
  const RISERVA_DEFAULT_S = 180;        // [EURISTICA, scelta di Claude]
  const MOLT_SOFT = 2.0;                // [EURISTICA, scelta di Claude]
  const G_CROC = 0.20;                  // probabilita' di indovinare una crocetta a 5 opzioni (Allegato 2 punto 4)
  const TEMPO_MAX_S = 900;              // SPEC §6: tempo > 900 s registrato come 900 con flag

  // ------------------------------------------------------------------ utilita'
  function assertInt(x, nome) {
    if (!Number.isInteger(x)) throw new RangeError(nome + ' deve essere un intero: ' + x);
  }

  /** coefficiente binomiale esatto (BigInt) convertito in Number (esatto per m <= 56) */
  function comb(m, k) {
    if (k < 0 || k > m) return 0;
    if (k > m - k) k = m - k;
    let r = 1n;
    for (let i = 1; i <= k; i++) r = (r * BigInt(m - k + i)) / BigInt(i);
    return Number(r);
  }

  // ------------------------------------------------------------------ regola d'esame
  /** giuste minime con A risposte date: 11C - A >= 180 (DM 941 art. 8 c.1, c.3). Ritorna un intero; se > A e' impossibile. */
  function c_min(A) {
    assertInt(A, 'A');
    if (A < 0) throw new RangeError('A < 0');
    return Math.floor((180 + A + 10) / 11);   // ceil((180 + A) / 11) in aritmetica intera
  }

  // ------------------------------------------------------------------ distribuzioni
  /** Beta-Binomiale(m; a, b) per ricorrenza, senza funzioni gamma. Ritorna array di lunghezza m + 1. */
  function bb_pmf(m, a, b) {
    assertInt(m, 'm');
    let p0 = 1.0;
    for (let i = 0; i < m; i++) p0 *= (b + i) / (a + b + i);
    const pmf = [p0];
    for (let k = 0; k < m; k++) {
      pmf.push(pmf[pmf.length - 1] * ((m - k) * (a + k)) / ((k + 1) * (b + m - k - 1)));
    }
    return pmf;
  }

  function bin_pmf(m, p) {
    assertInt(m, 'm');
    const out = [];
    for (let k = 0; k <= m; k++) out.push(comb(m, k) * Math.pow(p, k) * Math.pow(1 - p, m - k));
    return out;
  }

  function conv(x, y) {
    const out = new Array(x.length + y.length - 1).fill(0.0);
    for (let i = 0; i < x.length; i++) {
      for (let j = 0; j < y.length; j++) out[i + j] += x[i] * y[j];
    }
    return out;
  }

  function somma(arr, da) {
    let s = 0;
    for (let i = da; i < arr.length; i++) s += arr[i];
    return s;
  }

  /**
   * parti = [[m, a, b], ...]: m domande risposte nella cella con posteriore Beta(a, b).
   * plug = false: predittiva esatta (somma di Beta-Binomiali); plug = true: Binomiali con p = a/(a+b).
   * Ritorna P(giuste >= c_min(A)), dove A = totale delle risposte date.
   */
  function p_supera(parti, A, plug) {
    let pmf = [1.0];
    for (const [m, a, b] of parti) {
      pmf = conv(pmf, plug ? bin_pmf(m, a / (a + b)) : bb_pmf(m, a, b));
    }
    const c = c_min(A);
    return c > A ? 0.0 : somma(pmf, c);
  }

  /**
   * Variante di SCRIPT_F3c: gruppi = [[m, p], ...] con p nota; i gruppi con m = 0 sono saltati.
   * (Stessa regola di c_min; usata per i quesiti non letti e per i profili ipotetici.)
   */
  function p_supera_gruppi(gruppi, A) {
    let pmf = [1.0];
    for (const [m, p] of gruppi) {
      if (m > 0) pmf = conv(pmf, bin_pmf(m, p));
    }
    const c = c_min(A);
    return c > A ? 0.0 : somma(pmf, c);
  }

  // ------------------------------------------------------------------ composizione attesa
  /** composizione attesa di 31 domande dalle risposte della materia (resto piu' grande). conteggi: {A, M, B}. */
  function quote_attese(conteggi) {
    let tot = 0;
    for (const c of LIVELLI) tot += conteggi[c];
    if (!(tot > 0)) throw new RangeError('quote_attese: nessuna risposta');
    const raw = {}, base = {};
    let sb = 0;
    for (const c of LIVELLI) { raw[c] = NQ * conteggi[c] / tot; base[c] = Math.floor(raw[c]); sb += base[c]; }
    const resto = NQ - sb;
    const ord = LIVELLI.slice().sort((x, y) => {
      const d = -(raw[x] - base[x]) - (-(raw[y] - base[y]));
      return d !== 0 ? d : LIVELLI.indexOf(x) - LIVELLI.indexOf(y);
    });
    for (const c of ord.slice(0, resto)) base[c] += 1;
    return base;
  }

  /**
   * SPEC §5.3: composizione ATTESA della materia, solo con >= SOGLIA prime risposte nella materia.
   * conteggi: {A, M, B} = prime risposte della materia per livello. Altrimenti {stato:'dati insufficienti', mancano}.
   */
  function composizione_attesa(conteggi) {
    let tot = 0;
    for (const c of LIVELLI) tot += conteggi[c];
    if (tot < SOGLIA) return { stato: 'dati insufficienti', mancano: SOGLIA - tot };
    return { stato: 'ok', comp: quote_attese(conteggi) };
  }

  // ------------------------------------------------------------------ raccomandazione S18 / S29 / S31
  /**
   * celle: {A: [k, n], M: [k, n], B: [k, n]} prime risposte per livello (k giuste su n);
   * comp: {A, M, B} con somma 31 (attesa o realizzata).
   * Se un livello ha n < SOGLIA: {stato: 'dati insufficienti', mancano: {livello: risposte_mancanti}}.
   * Altrimenti {stato: 'ok', p_hat, ordine, scenari: [{shift, P: {18, 29, 31}, migliore, decisione}, ...]}
   * con scenari nell'ordine di SCENARI (0, -0.05, -0.10).
   */
  function raccomanda(celle, comp) {
    const mancano = {};
    let manca = false;
    for (const c of LIVELLI) {
      const [k, n] = celle[c];
      assertInt(k, 'k'); assertInt(n, 'n');
      if (k < 0 || k > n) throw new RangeError('celle[' + c + ']: k deve stare in [0, n]');
      if (n < SOGLIA) { mancano[c] = SOGLIA - n; manca = true; }
    }
    if (manca) return { stato: 'dati insufficienti', mancano };
    let sc = 0;
    for (const c of LIVELLI) { assertInt(comp[c], 'comp'); if (comp[c] < 0) throw new RangeError('comp < 0'); sc += comp[c]; }
    if (sc !== NQ) throw new RangeError('la composizione deve sommare a 31 (somma: ' + sc + ')');

    const post = {}, pm = {};
    for (const c of LIVELLI) {
      const [k, n] = celle[c];
      post[c] = [PRIOR_A + k, PRIOR_B + n - k];
      pm[c] = post[c][0] / (post[c][0] + post[c][1]);
    }
    const ordine = LIVELLI.slice().sort((x, y) => (pm[y] - pm[x]) || (LIVELLI.indexOf(x) - LIVELLI.indexOf(y)));
    const ids = [];
    for (const c of ordine) for (let i = 0; i < comp[c]; i++) ids.push(c);

    function parti(A, shift) {
      const cnt = new Map();   // ordine di inserimento = ordine di prima comparsa (come il dict Python)
      for (const c of ids.slice(0, A)) cnt.set(c, (cnt.get(c) || 0) + 1);
      const out = [];
      for (const [c, m] of cnt) {
        if (shift === null) out.push([m, post[c][0], post[c][1]]);
        else {
          const p = Math.min(0.99, Math.max(0.01, pm[c] + shift));
          out.push([m, p, 1 - p]);
        }
      }
      return out;
    }

    const scenari = [];
    for (const sh of SCENARI) {
      const P = {};
      for (const A of [18, 29, 31]) P[A] = p_supera(parti(A, sh === 0.0 ? null : sh), A, sh !== 0.0);
      let best = 18;   // massimo per (P, A): a parita' di P vince A piu' grande
      for (const A of [29, 31]) if (P[A] > P[best] || (P[A] === P[best] && A > best)) best = A;
      const ordinati = [P[18], P[29], P[31]].sort((a, b) => b - a);
      scenari.push({
        shift: sh, P, migliore: best,
        decisione: (ordinati[0] - ordinati[1] >= 0.01) ? ('S' + best) : 'equivalenti (differenza < 1 punto)'
      });
    }
    return { stato: 'ok', p_hat: pm, ordine, scenari };
  }

  // ------------------------------------------------------------------ intervallo di Wilson e etichette unita'
  /** intervallo di Wilson per k successi su n con quantile z. Ritorna [inferiore, superiore]. */
  function wilson(k, n, z) {
    const ph = k / n, d = 1 + z * z / n;
    const c = (ph + z * z / (2 * n)) / d;
    const h = z * Math.sqrt(ph * (1 - ph) / n + z * z / (4 * n * n)) / d;
    return [c - h, c + h];
  }

  const TESTI_ETICHETTA = {
    DATI_INSUFFICIENTI: 'dati insufficienti',
    RIFERIMENTO_INSUFFICIENTE: 'valore mostrato, nessuna etichetta (riferimento insufficiente)',
    SEGNALE_DEBOLE: 'SEGNALE: più debole della tua media sulle altre unità',
    SEGNALE_FORTE: 'SEGNALE: più forte della tua media sulle altre unità',
    INDIZIO_DEBOLE: 'INDIZIO: più debole (da confermare)',
    INDIZIO_FORTE: 'INDIZIO: più forte (da confermare)',
    NESSUNA_DIFFERENZA: 'nessuna differenza dimostrata'
  };

  /**
   * k giuste su n prime risposte dell'unita'; (k_rif, n_rif) = somma delle ALTRE unita' della stessa materia.
   * Ritorna {codice, testo}. Testi: SPEC_F4 §5.2 (il testo dice "più debole della tua media", mai "sei debole in X").
   */
  function etichetta_unita(k, n, k_rif, n_rif) {
    const esito = (codice) => ({ codice, testo: TESTI_ETICHETTA[codice] });
    if (n < SOGLIA) return esito('DATI_INSUFFICIENTI');
    if (n_rif < RIF_MIN) return esito('RIFERIMENTO_INSUFFICIENTE');
    const ref = k_rif / n_rif;
    const [lo99, hi99] = wilson(k, n, Z99), [lo95, hi95] = wilson(k, n, Z95);
    if (hi99 < ref) return esito('SEGNALE_DEBOLE');
    if (lo99 > ref) return esito('SEGNALE_FORTE');
    if (hi95 < ref) return esito('INDIZIO_DEBOLE');
    if (lo95 > ref) return esito('INDIZIO_FORTE');
    return esito('NESSUNA_DIFFERENZA');
  }

  // ------------------------------------------------------------------ esame (SPEC §5.4)
  /**
   * Indicatori secondari con P_m = P(superare) della strategia scelta per ciascuna delle 3 materie.
   * ASSUME indipendenza tra materie (l'abilita' comune le correla) e tentativo unico.
   * p3 = [P1, P2, P3]. Ritorna {tre_su_tre, almeno_due}.
   */
  function esame_indicatori(p3) {
    if (!Array.isArray(p3) || p3.length !== 3) throw new RangeError('servono 3 probabilita');
    const [a, b, c] = p3;
    return {
      tre_su_tre: a * b * c,
      almeno_due: a * b + a * c + b * c - 2 * a * b * c
    };
  }

  // ------------------------------------------------------------------ tempo (SPEC §6)
  /** secondi per quesito, con una riserva finale (per barrare i cerchietti delle omesse e ricontrollare) [EURISTICA] */
  function budget_s(riserva_s) {
    if (riserva_s === undefined) riserva_s = RISERVA_DEFAULT_S;
    return (TEMPO_S - riserva_s) / NQ;
  }

  /** quesiti che, a ritmo uniforme, dovresti aver affrontato dopo 'minuti' minuti (parte intera, per difetto) */
  function checkpoint(minuti, riserva_s) {

   * Ritorna {ok, errore?, registro, voce}. La confidenza non ha alcuna funzione di modifica.
   */
  function registraConfidenza(registro, sessione, livello, prima, adesso, rnd) {
    if (!sessione || !MATERIE.includes(sessione.materia)) return { ok: false, errore: 'Scegli prima la materia.' };
    if (!LIVELLI.includes(livello)) return { ok: false, errore: 'Livello di confidenza non valido.' };
    const ts = adesso.getTime();
    let id = nuovoId(ts, rnd);
    const ids = new Set(registro.map((x) => x.id));
    for (let giri = 1; ids.has(id); giri++) id = nuovoId(ts, rnd) + (giri > 5 ? giri.toString(36) : '');   // collisione: dopo 5 tentativi si aggiunge un contatore
    const voce = { id, ts, data: dataLocale(adesso), materia: sessione.materia, formato: FORMATI.includes(sessione.formato) ? sessione.formato : 'C',
      unita: Number.isInteger(sessione.unita) && sessione.unita >= 1 && sessione.unita <= N_UNITA ? sessione.unita : null, livello, esito: null, prima: !!prima };
    return { ok: true, registro: registro.map(copiaVoce).concat([voce]), voce: copiaVoce(voce) };
  }
  /** Passo 2: imposta l'esito di una voce IN SOSPESO. */
  function impostaEsito(registro, id, esito) {
    const v = registro.find((x) => x.id === id);
    if (!v) return { ok: false, errore: 'voce non trovata', registro };
    if (v.esito !== null) return { ok: false, errore: 'la voce ha già un esito', registro };
    if (esito !== true && esito !== false) return { ok: false, errore: 'esito non valido', registro };
    return { ok: true, registro: registro.map((x) => (x.id === id ? Object.assign(copiaVoce(x), { esito }) : copiaVoce(x))) };
  }
  /** «Correggi esito»: inverte giusta/sbagliata di una voce gia' valutata. */
  function correggiEsito(registro, id) {
    const v = registro.find((x) => x.id === id);
    if (!v || v.esito === null) return { ok: false, errore: 'voce non valutata', registro };
    return { ok: true, registro: registro.map((x) => (x.id === id ? Object.assign(copiaVoce(x), { esito: !x.esito }) : copiaVoce(x))) };
  }
  function eliminaVoce(registro, id) {
    if (!registro.some((x) => x.id === id)) return { ok: false, errore: 'voce non trovata', registro };
    return { ok: true, registro: registro.filter((x) => x.id !== id).map(copiaVoce) };
  }
  /** Voci senza esito (qualunque `prima`), dalla piu' recente. */
  const inSospeso = (registro) => registro.filter((x) => x.esito === null).reverse();
  /** Ultime n voci valutate, dalla piu' recente. */
  const ultimeValutate = (registro, n) => registro.filter((x) => x.esito !== null).slice(-n).reverse();

  // ------------------------------------------------------------------ aggregazione (BRIEF passo2 §4.3): interi, nessuna percentuale intermedia
  /**
   * Considera SOLO le voci con prima === true e esito !== null. Non modifica il registro.
   * livelli: {A:[k,n], M:[k,n], B:[k,n]} (tutte le materie e i formati, anche senza unita');
   * unita: {CHIM:[[k,n] x7], FIS:[…], BIO:[…]} con indice 0 = UD1, SOLO voci con unita' non nulla;
   * per_materia: n per materia; in_sospeso: voci senza esito (qualunque `prima`); ripassi: voci con prima === false (valutate o no);
   * totale_prime: prime risposte valutate.
   */
  function aggrega_registro(registro) {
    const livelli = { A: [0, 0], M: [0, 0], B: [0, 0] };
    const unita = {}, per_materia = {};
    for (const m of MATERIE) { per_materia[m] = 0; unita[m] = []; for (let u = 0; u < N_UNITA; u++) unita[m].push([0, 0]); }
    let in_sospeso = 0, ripassi = 0, totale_prime = 0;
    for (let i = 0; i < registro.length; i++) {
      const v = registro[i];
      if (v.esito === null) in_sospeso++;
      if (v.prima === false) ripassi++;
      if (v.prima !== true || v.esito === null) continue;
      totale_prime++;
      per_materia[v.materia]++;
      livelli[v.livello][1]++;
      if (v.esito === true) livelli[v.livello][0]++;
      if (v.unita !== null) { const c = unita[v.materia][v.unita - 1]; c[1]++; if (v.esito === true) c[0]++; }
    }
    return { livelli, unita, per_materia, in_sospeso, ripassi, totale_prime };
  }

  // ------------------------------------------------------------------ Livelli e Unita' (BRIEF passo2 §4.4, §4.5): testi fissi della Regia
  /** Percentuale intera piu' vicina (mezzi in su), con soli interi. */
  const percento = (k, n) => Math.floor((200 * k + n) / (2 * n));
  /** Wilson 95% del motore, arrotondato VERSO L'ESTERNO (lo = floor, hi = ceil), in punti percentuali interi. */
  function intervallo95(k, n) {
    const [lo, hi] = M.wilson(k, n, M.Z95), EPS = 1e-9;
    return { lo: Math.max(0, Math.floor(lo * 100 + EPS)), hi: Math.min(100, Math.ceil(hi * 100 - EPS)) };
  }

  function valutaLivelli(agg) {
    const righe = LIVELLI.map((l) => {
      const [k, n] = agg.livelli[l], nome = NOME_LIVELLO[l];
      if (n < SOGLIA) return { livello: l, nome, k, n, sufficiente: false, testo: nome + ': dati insufficienti (' + n + ' su ' + SOGLIA + ' risposte necessarie)' };
      const p = percento(k, n), iv = intervallo95(k, n);
      return { livello: l, nome, k, n, sufficiente: true, p, lo: iv.lo, hi: iv.hi, testo: nome + ': ' + p + '% giuste (n = ' + n + '; intervallo 95%: ' + iv.lo + '–' + iv.hi + '%)' };
    });
    const tutti = righe.every((r) => r.sufficiente);
    let inversione = null;
    if (tutti) {
      const [A, Mm, B] = righe;
      const piu = (x, y) => x.k * y.n > y.k * x.n;           // k/n di x > k/n di y, in frazioni
      inversione = piu(Mm, A) || piu(B, Mm) || piu(B, A);
    }
    return { righe, inversione, testo_inversione: inversione ? TESTO_INVERSIONE : null };
  }
  const TESTO_INVERSIONE = 'i tuoi livelli di confidenza non sono ancora ordinati: la confidenza non distingue ancora le risposte sicure da quelle incerte';

  /** Per una materia: 7 righe con testo e etichetta del motore (etichetta_unita), riferimento = somma delle ALTRE sei unita'. */
  function valutaUnita(agg, materia) {
    const celle = agg.unita[materia];
    const tot = celle.reduce((a, c) => [a[0] + c[0], a[1] + c[1]], [0, 0]);
    const righe = celle.map((c, i) => {
      const k = c[0], n = c[1], k_rif = tot[0] - k, n_rif = tot[1] - n;
      const et = M.etichetta_unita(k, n, k_rif, n_rif);
      if (n < SOGLIA) return { unita: i + 1, k, n, k_rif, n_rif, sufficiente: false, codice: et.codice, testo: 'dati insufficienti (n = ' + n + ' su ' + SOGLIA + ')', etichetta: null };
      const p = percento(k, n), iv = intervallo95(k, n);
      return { unita: i + 1, k, n, k_rif, n_rif, sufficiente: true, p, lo: iv.lo, hi: iv.hi, codice: et.codice,
        testo: k + '/' + n + ' = ' + p + '% (intervallo 95%: ' + iv.lo + '–' + iv.hi + '%)', etichetta: et.testo };
    });
    return { materia, righe };
  }
  /** Riga sotto la tabella di ogni unita' (BRIEF passo2 §4.5): riferimento = altre unita' della stessa materia. */
  function testoRiferimento(n_rif) {
    return 'Riferimento (altre unità): ' + n_rif + ' risposte' + (n_rif < RIF_MIN ? '. Etichette disattivate: servono almeno ' + RIF_MIN + ' risposte nelle altre unità.' : '');
  }

  /** Titoli delle unita' da UNITA_F4d.md: righe «MATERIA | numero | titolo». Ritorna {titoli:{CHIM:[7],…}|null, avvisi[], errori[]}. */
  function parseUnita(testo) {
    const avvisi = [], errori = [];
    const t = String(testo || '').replace(/\r\n?/g, '\n');
    const titoli = { CHIM: new Array(N_UNITA).fill(null), FIS: new Array(N_UNITA).fill(null), BIO: new Array(N_UNITA).fill(null) };
    let trovate = 0;
    for (const riga of t.split('\n')) {
      const r = riga.trim();
      if (!/^(CHIM|FIS|BIO)(?![A-Za-z])/.test(r)) continue;
      const p = r.split('|').map((x) => x.trim());
      if (p.length < 3 || !MATERIE.includes(p[0]) || !/^[1-7]$/.test(p[1]) || p.slice(2).join('|').trim() === '') { errori.push('UNITA: riga non valida (atteso «MATERIA | 1…7 | titolo»): «' + r.slice(0, 50) + '»'); continue; }
      const u = Number(p[1]) - 1;
      if (titoli[p[0]][u] !== null) { errori.push('UNITA: ' + p[0] + ' unità ' + p[1] + ' presente due volte'); continue; }
      titoli[p[0]][u] = p.slice(2).join('|').trim();
      trovate++;
    }
    if (t.trim() === '') { avvisi.push('UNITA_F4d.md mancante: le unità saranno mostrate come UD1…UD7 senza titolo'); return { titoli: null, avvisi, errori }; }
    for (const m of MATERIE) { const n = titoli[m].filter((x) => x !== null).length; if (n !== N_UNITA) errori.push('UNITA: ' + m + ' ha ' + n + ' unità invece di ' + N_UNITA); }
    return { titoli: errori.length ? null : titoli, avvisi, errori };
  }
  /** «UD3 – titolo» oppure «UD3» se i titoli mancano. */
  function nomeUnita(titoli, materia, u) { return 'UD' + u + (titoli && titoli[materia][u - 1] ? ' – ' + titoli[materia][u - 1] : ''); }

  // ------------------------------------------------------------------ calcolatore (BRIEF §4.4) - tutto con interi
  /** Testo del campo -> {stato: 'vuoto'|'ok'|'errore', valore}. Solo cifre decimali (nessun segno, virgola o punto). */
  function leggiIntero(s) {
    const t = String(s).trim();
    if (t === '') return { stato: 'vuoto', valore: null };
    if (!/^\d{1,6}$/.test(t)) return { stato: 'errore', valore: null };
    return { stato: 'ok', valore: Number(t) };
  }

  /** decimi di punto (10C - E) -> «18,0», «-0,1» */
  function formatDecimi(d) {
    const a = Math.abs(d);
    return (d < 0 ? '-' : '') + Math.floor(a / 10) + ',' + (a % 10);
  }

  /** Un esame: C giuste, E errate (interi >= 0, C + E <= 31). S = (10C - E)/10 si supera con 10C - E >= 180 (DM 941 art. 8 c.1 e c.3). */
  function calcola(C, E) {
    if (!Number.isInteger(C) || !Number.isInteger(E) || C < 0 || E < 0) return { ok: false, errore: 'Giuste ed errate devono essere numeri interi, 0 o più.' };
    if (C + E > M.NQ) return { ok: false, errore: 'Giuste + errate = ' + (C + E) + ': non può superare ' + M.NQ + '.' };
    const A = C + E, decimi = 10 * C - E, cm = M.c_min(A);
    const raggiungibile = cm <= A;
    return { ok: true, C, E, A, omesse: M.NQ - A, decimi, punteggio: formatDecimi(decimi), superato: decimi >= 180,
      raggiungibile, cmin: raggiungibile ? cm : null, ammessi: raggiungibile ? A - cm : null };
  }

  /** Tabella fissa A = 18..31 dal motore. */
  function tabellaCmin() {
    const t = [];
    for (let A = 18; A <= M.NQ; A++) { const c = M.c_min(A); t.push({ A, cmin: c, ammessi: A - c }); }
    return t;
  }

  const MATERIE_ESAME = ['Chimica e propedeutica biochimica', 'Fisica', 'Biologia'];   // DM 941 art. 6 c.2
  const BONUS_SEZIONE = { 0: 0, 1: 100, 2: 200, 3: 300 };                              // DM 941 art. 10
  const TESTO_SUPERATI = { 0: 'nessuno superato', 1: '1 su 3 superati', 2: '2 su 3 superati', 3: '3 su 3 superati' };

  /** coppie = [{C, E}, {C, E}, {C, E}] (numeri interi gia' letti). Nessun punteggio totale. */
  function esameCompleto(coppie) {
    if (!Array.isArray(coppie) || coppie.length !== 3) return { ok: false, errore: 'Servono tre coppie di valori.' };
    const sezioni = [];
    for (let i = 0; i < 3; i++) {
      const r = calcola(coppie[i].C, coppie[i].E);
      if (!r.ok) return { ok: false, errore: MATERIE_ESAME[i] + ': ' + r.errore };
      sezioni.push(Object.assign({ nome: MATERIE_ESAME[i] }, r));
    }
    const superati = sezioni.filter((s) => s.superato).length;
    return { ok: true, sezioni, superati, testo: TESTO_SUPERATI[superati], bonus: BONUS_SEZIONE[superati] };
  }

  // ------------------------------------------------------------------ cronometro (BRIEF §4.5)
  const CHECKPOINT_MIN = [10, 20, 30, 40];
  const fmt2 = (x) => x.toFixed(2).replace('.', ',');

  function parametriCrono(riserva) {
    return { riserva, budget_s: M.budget_s(riserva), limite_s: M.limite_morbido_s(riserva),
      checkpoint: CHECKPOINT_MIN.map((m) => ({ minuti: m, obiettivo: M.checkpoint(m, riserva) })) };
  }

  function mmss(s) {
    const t = Math.max(0, Math.ceil(s)), m = Math.floor(t / 60), x = t % 60;
    return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
  }

  /** Stato del cronometro dato il tempo trascorso (calcolato dai timestamp), la riserva e i quesiti affrontati. */
  function statoCrono(trascorso_s, riserva, affrontati) {
    const t = Math.max(0, trascorso_s);
    const rimanente = Math.max(0, M.TEMPO_S - t);
    const finito = t >= M.TEMPO_S;
    const inRiserva = !finito && riserva > 0 && rimanente <= riserva;
    const passati = CHECKPOINT_MIN.filter((m) => t >= m * 60);
    const ultimo = passati.length ? passati[passati.length - 1] : null;
    let box = null;
    if (ultimo !== null) {
      const ob = M.checkpoint(ultimo, riserva), diff = affrontati - ob;
      box = { minuti: ultimo, obiettivo: ob, diff, posizione: diff > 0 ? 'avanti' : diff < 0 ? 'indietro' : 'in linea',
        testo: 'Minuto ' + ultimo + ': obiettivo ≈ ' + ob + ' quesiti affrontati. ' + (diff > 0 ? 'Sei avanti di ' + diff : diff < 0 ? 'Sei indietro di ' + (-diff) : 'Sei in linea') + '.' };
    }
    const prossimo = CHECKPOINT_MIN.find((m) => t < m * 60);
    return { trascorso_s: t, rimanente_s: rimanente, finito, inRiserva, checkpointPassati: passati, box,
      prossimo: prossimo === undefined ? null : { minuti: prossimo, obiettivo: M.checkpoint(prossimo, riserva) } };
  }

  // ------------------------------------------------------------------ contenuti del corso (BRIEF §5.3)
  const ETICHETTE = ['NON VERIFICATO', 'CONOSCENZA GENERALE', 'CERTO', 'CALCOLO', 'EURISTICA', 'STIMA'];
  const CLASSE_ETICHETTA = { 'NON VERIFICATO': 'nv', 'CONOSCENZA GENERALE': 'cg', CERTO: 'certo', CALCOLO: 'calc', EURISTICA: 'eur', STIMA: 'stima' };
  const SEZIONI_MODULO = ['Regola', 'Perché vale', 'Dove smette di funzionare', 'Verifica'];
  const SEGNAPOSTO = 'SEGNAPOSTO – non è contenuto del corso';
  const RE_CAPS = /^[A-ZÀ-Ý]{3,}(?: [A-ZÀ-Ý]{3,})*(?=$|[\s–—,:;-])/;

  function tipoEtichetta(c) {
    for (const e of ETICHETTE) if (c === e || (c.startsWith(e) && /^[\s–—,:;-]/.test(c.slice(e.length)))) return e;
    return null;
  }

  // Etichette composte (BRIEF passo2 §4.9.2): un badge per ciascun nome noto in maiuscolo, nell'ordine di apparizione, seguiti dal testo.
  // (niente lookbehind: Safari < 16.4 non lo supporta)
  const RE_NOMI = new RegExp('(^|[^A-Za-zÀ-ÿ])(' + ETICHETTE.join('|') + ')(?![A-Za-zÀ-ÿ])', 'g');
  /** {nomi: [{tipo, classe}…], residuo} — nomi in ordine di apparizione; residuo = testo senza i nomi, senza separatori ai bordi. */
  function nomiNoti(c) {
    const nomi = []; let m;
    RE_NOMI.lastIndex = 0;
    while ((m = RE_NOMI.exec(c)) !== null) nomi.push({ tipo: m[2], classe: CLASSE_ETICHETTA[m[2]] });
    const residuo = c.replace(RE_NOMI, (x, pre) => pre).replace(/([;:,–—-])[\s;:,–—-]*[;:,–—-]/g, '$1').replace(/\s{2,}/g, ' ').replace(/^[\s–—,:;-]+|[\s–—,:;-]+$/g, '');
    return { nomi, residuo };
  }
  function parseEnfasi(seg) {
    const out = [];
    for (const p of seg.split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/)) {
      if (p === '') continue;
      if (p.length > 4 && p.startsWith('**') && p.endsWith('**')) out.push({ t: 'b', testo: p.slice(2, -2) });
      else if (p.length > 2 && p.startsWith('*') && p.endsWith('*') && !p.startsWith('**')) out.push({ t: 'i', testo: p.slice(1, -1) });
      else out.push({ t: 'txt', testo: p });
    }
    return out;
  }

  /** Testo -> lista di pezzi {t:'txt'|'b'|'i'|'et', testo, tipo?, classe?}. Etichette sconosciute: testo normale + avviso. */
  function parseInline(testo, avvisi) {
    const out = [];
    const re = /\[([^\[\]]{1,300})\]/g;
    let da = 0, m;
    while ((m = re.exec(testo)) !== null) {
      const tipo = tipoEtichetta(m[1]);
      if (!tipo && !RE_CAPS.test(m[1])) continue;            // parentesi quadre qualunque: restano testo
      if (m.index > da) out.push(...parseEnfasi(testo.slice(da, m.index)));
      if (tipo) out.push(Object.assign({ t: 'et', testo: m[1], tipo, classe: CLASSE_ETICHETTA[tipo] }, nomiNoti(m[1])));
      else { if (avvisi) avvisi.push('etichetta sconosciuta «[' + m[1] + ']» (mostrata come testo normale)'); out.push({ t: 'txt', testo: m[0] }); }
      da = m.index + m[0].length;
    }
    if (da < testo.length) out.push(...parseEnfasi(testo.slice(da)));
    return out;
  }

  const spezzaRiga = (r) => { const c = r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((x) => x.trim()); return c; };
  const RE_SEPARATORE = /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

  /** Righe di una sezione -> blocchi {t:'p'|'ul'|'tab'} con testo gia' scomposto in pezzi. */
  function parseBlocchi(righe, avvisi) {
    const blocchi = [];
    let par = [], lista = null, tab = null;
    const chiudiPar = () => { if (par.length) { blocchi.push({ t: 'p', tok: parseInline(par.join(' '), avvisi) }); par = []; } };
    const chiudiLista = () => { if (lista) { blocchi.push({ t: 'ul', voci: lista.map((v) => parseInline(v, avvisi)) }); lista = null; } };
    const chiudiTab = () => {
      if (!tab) return;
      let intest = null, corpo = tab;
      if (tab.length >= 2 && RE_SEPARATORE.test(tab[1])) { intest = spezzaRiga(tab[0]); corpo = tab.slice(2); }
      blocchi.push({ t: 'tab', intest: intest && intest.map((c) => parseInline(c, avvisi)), righe: corpo.filter((r) => !RE_SEPARATORE.test(r)).map((r) => spezzaRiga(r).map((c) => parseInline(c, avvisi))) });
      tab = null;
    };
    const chiudiTutto = () => { chiudiPar(); chiudiLista(); chiudiTab(); };
    for (const grezza of righe) {
      if (/<\/?[a-z][^>]*>/i.test(grezza)) avvisi.push('possibile HTML nel testo (verrà mostrato come testo): «' + grezza.trim().slice(0, 40) + '…»');
      const r = grezza.replace(/\s+$/, '');
      if (r.trim() === '') { chiudiTutto(); continue; }
      if (/^#{3,}\s/.test(r)) { avvisi.push('intestazione di livello 3 o più non supportata: «' + r.trim().slice(0, 40) + '»'); chiudiTutto(); par.push(r.replace(/^#+\s*/, '')); continue; }
      if (/^- /.test(r)) { chiudiPar(); chiudiTab(); if (!lista) lista = []; lista.push(r.slice(2).trim()); continue; }
      if (/^\s+\S/.test(r) && lista) { lista[lista.length - 1] += ' ' + r.trim(); continue; }
      if (/^\s*\|/.test(r)) { chiudiPar(); chiudiLista(); if (!tab) tab = []; tab.push(r.trim()); continue; }
      chiudiLista(); chiudiTab(); par.push(r.trim());
    }
    chiudiTutto();
    return blocchi;
  }

  /** Divide le righe in sezioni `## `: ritorna {pre: righe prima della prima sezione, sezioni: [{titolo, righe}]}. */
  function dividiSezioni(righe) {
    const pre = [], sezioni = [];
    for (const r of righe) {
      const m = /^##\s+(.+?)\s*$/.exec(r);
      if (m) sezioni.push({ titolo: m[1], righe: [] });
      else if (sezioni.length) sezioni[sezioni.length - 1].righe.push(r);
      else pre.push(r);
    }
    return { pre, sezioni };
  }

  const RE_VERIFICA = /^-\s*([VF])\s*\|\s*(.+?)\s*\|\s*(.+)$/;

  /**
   * Legge CONTENUTI_F4d.md. Ritorna {revisione, segnaposto, moduli[], guida|null, avvisi[], errori[]}.
   * errori = il build si ferma (sezione mancante o duplicata, Verifica non valida, modulo duplicato, file senza moduli);
   * avvisi = il build continua (etichetta sconosciuta, HTML, testo fuori sezione, revisione o durata mancanti, moduli attesi 0-5 mancanti).
   */
  function parseContenuti(testo) {
    const avvisi = [], errori = [];
    const righe = String(testo).replace(/\r\n?/g, '\n').split('\n');
    const intest = [];
    righe.forEach((r, i) => { const m = /^#\s+(.*)$/.exec(r); if (m) intest.push({ i, titolo: m[1].trim() }); });
    const elementi = [];
    let primo = intest.findIndex((x) => /^Modulo\s+\d+\s*[–—-]\s*\S/.test(x.titolo) || /^Guida d['’]uso\s*$/i.test(x.titolo));
    if (primo < 0) primo = intest.length;
    // revisione: nella parte prima del primo modulo/guida
    const finePre = primo < intest.length ? intest[primo].i : righe.length;
    const mr = /(?:^|[\s:])v(\d+)\b/i.exec(righe.slice(0, finePre).join('\n'));
    const revisione = mr ? 'v' + mr[1] : null;
    if (!revisione) avvisi.push('revisione (v<n>) non trovata in testa al file');
    intest.forEach((x, k) => {
      const fine = k + 1 < intest.length ? intest[k + 1].i : righe.length;
      const mm = /^Modulo\s+(\d+)\s*[–—-]\s*(.+)$/.exec(x.titolo);
      if (mm) elementi.push({ tipo: 'modulo', n: Number(mm[1]), titolo: mm[2].trim(), righe: righe.slice(x.i + 1, fine), nome: 'Modulo ' + mm[1] });
      else if (/^Guida d['’]uso\s*$/i.test(x.titolo)) elementi.push({ tipo: 'guida', titolo: "Guida d'uso", righe: righe.slice(x.i + 1, fine), nome: "Guida d'uso" });
      else if (k >= primo) avvisi.push('intestazione «# ' + x.titolo + '» ignorata (non è un modulo né la guida)');
    });

    const moduli = [];
    let guida = null;
    const visti = new Set();
    for (const el of elementi) {
      const { pre, sezioni } = dividiSezioni(el.righe);
      let lettura = null;
      for (const r of pre) {
        if (r.trim() === '') continue;
        const ml = /^Lettura:\s*(\d+)\s*minut/i.exec(r.trim());
        if (ml && lettura === null) lettura = Number(ml[1]);
        else avvisi.push(el.nome + ': testo fuori da una sezione, ignorato: «' + r.trim().slice(0, 40) + '»');
      }
      const titoli = sezioni.map((s) => s.titolo);
      const dup = titoli.find((t, i) => titoli.indexOf(t) !== i);
      if (dup) errori.push(el.nome + ': sezione «' + dup + '» ripetuta');
      if (el.tipo === 'modulo') {
        if (visti.has(el.n)) { errori.push('Modulo ' + el.n + ' presente due volte'); continue; }
        visti.add(el.n);
        if (lettura === null) avvisi.push(el.nome + ': manca la riga «Lettura: N minuti»');
        for (const s of SEZIONI_MODULO) if (!titoli.includes(s)) errori.push(el.nome + ': manca la sezione «' + s + '»');
        const sez = [];
        let verifica = [];
        for (const s of sezioni) {
          if (s.titolo === 'Verifica') {
            for (const r of s.righe) {
              if (r.trim() === '') continue;
              const v = RE_VERIFICA.exec(r.trim());
              if (!v) { errori.push(el.nome + ', Verifica: riga non valida (atteso «- V | affermazione | spiegazione»): «' + r.trim().slice(0, 50) + '»'); continue; }
              verifica.push({ vero: v[1] === 'V', affermazione: parseInline(v[2], avvisi.length >= 0 ? avvisi : null), spiegazione: parseInline(v[3], avvisi) });
            }
            if (verifica.length === 0 && titoli.includes('Verifica')) errori.push(el.nome + ': la Verifica non contiene affermazioni valide');
          } else {
            const a = []; const blocchi = parseBlocchi(s.righe, a);
            a.forEach((x) => avvisi.push(el.nome + ', «' + s.titolo + '»: ' + x));
            if (blocchi.length === 0) avvisi.push(el.nome + ': la sezione «' + s.titolo + '» è vuota');
            sez.push({ titolo: s.titolo, blocchi });
          }
        }
        moduli.push({ id: 'm' + el.n, n: el.n, titolo: el.titolo, lettura, sezioni: sez, verifica });
      } else {
        if (guida) { errori.push("Guida d'uso presente due volte"); continue; }
        if (sezioni.length === 0) errori.push("Guida d'uso: nessuna sezione «## …»");
        const sez = sezioni.map((s) => { const a = []; const blocchi = parseBlocchi(s.righe, a); a.forEach((x) => avvisi.push("Guida d'uso, «" + s.titolo + '»: ' + x)); return { titolo: s.titolo, blocchi }; });
        guida = { id: 'guida', titolo: el.titolo, lettura, sezioni: sez };
      }
    }
    moduli.sort((a, b) => a.n - b.n);
    if (moduli.length === 0 && !guida) errori.push('il file non contiene alcun modulo né la guida');
    const attesi = [0, 1, 2, 3, 4, 5].filter((n) => !visti.has(n));
    if (moduli.length && attesi.length) avvisi.push('moduli attesi 0–5 non presenti: ' + attesi.join(', '));
    return { revisione, segnaposto: String(testo).includes(SEGNAPOSTO), moduli, guida, avvisi, errori };
  }

  return {
    APP, VERSIONE, RISERVA_MIN, RISERVA_MAX, SEGNAPOSTO, SEZIONI_MODULO, ETICHETTE, MATERIE_ESAME,
    MATERIE, NOME_MATERIA, FORMATI, NOME_FORMATO, LIVELLI, NOME_LIVELLO, N_UNITA, MAX_VOCI, SOGLIA, RIF_MIN,

  };

# Modulo 0 – Le regole del gioco

# Modulo 1 – Crocette
Lettura: 5 minuti

## Regola
**Come si compila**
- Segno X in UNA casella. Puoi correggere una sola volta: annerisci completamente la casella precedente e segna un'altra [CERTO – Allegato 2 punto 16, pp. 4–5].
- Perché il punteggio sia attribuito deve risultare una X in una sola delle cinque caselle [CERTO – Allegato 2 punto 16, p. 5].
- Per dichiarare con certezza che non rispondi si barra il cerchietto accanto al numero della domanda; una volta barrato non è più modificabile [CERTO – Allegato 2 punto 16, p. 5].
- Penna nera in dotazione, esclusivamente quella [CERTO – Allegato 2 punto 16, p. 4].

**Quanto vale rispondere**
- Con p = probabilità che la tua risposta sia giusta, il valore atteso è 1,1·p − 0,1 punti [CALCOLO: p·(+1) + (1 − p)·(−0,1)].
- Il pareggio è p = 1/11, cioè circa 9,1% [CALCOLO].
- Scegliere a caso tra 5 opzioni dà p = 20% e un valore atteso di +0,12 punti rispetto a omettere [CALCOLO].
- Esempio: 5 crocette lasciate in bianco, se invece risposte a caso, valgono in media +0,6 punti per esame (5 × 0,12) [CALCOLO]. È una media: in un singolo esame il risultato può essere migliore o peggiore, e non è una promessa di punti.

| Opzioni scartate (correttamente) | Probabilità scegliendo a caso tra le rimaste | Valore atteso |
|---|---|---|
| 0 | 20,0% | +0,120 |
| 1 | 25,0% | +0,175 |
| 2 | 33,3% | +0,267 |
| 3 | 50,0% | +0,450 |

Valori calcolati con la formula 1,1·p − 0,1, nel caso in cui l'opzione giusta sia tra quelle rimaste [CALCOLO].

**Eliminazione**
- Scartare opzioni serve ad alzare p, non a decidere se rispondere: già a p = 20% rispondere conviene in valore atteso [EURISTICA].
- Omettere ha senso, in valore atteso, solo se stimi p sotto il 9,1% [CALCOLO]. Con 5 opzioni significa credere di essere peggio del caso: succede se sospetti che l'opzione che ti attrae sia proprio una trappola [EURISTICA].

**Suggerimenti non validati**
- Controllo dimensionale: se le opzioni sono numeri con unità o ordini di grandezza diversi, verifica quali sono compatibili con ciò che la domanda chiede, prima di fare tutto il calcolo [EURISTICA].
- Sostituzione: se le opzioni sono valori da inserire in un'espressione, provarne alcune può essere più rapido che ricavare il risultato [EURISTICA].
- Segnali testuali nelle opzioni (parole assolute, opzione molto più lunga): è un'ipotesi non validata e non raccomandata. Usala al massimo per scegliere tra opzioni che già ritieni plausibili, mai al posto del ragionamento [EURISTICA].

**Trasferire le risposte**
- I fogli con le domande restano all'università; al CINECA vanno i moduli risposte per la rilevazione informatizzata [CERTO – Allegato 2 punti 17–18, pp. 5–6]. Quindi conta ciò che è scritto sul modulo risposte.
- Hai una sola correzione per domanda: segna sul modulo solo ciò che hai deciso. Per le ipotesi provvisorie usa i fogli di brutta copia, che sono due per plico [CERTO – Allegato 2 punto 14, p. 4] [EURISTICA].

## Perché vale
Con +1 / 0 / −0,1 e cinque opzioni, la penalità è piccola rispetto al premio: lasciare in bianco una domanda su cui hai anche solo un'idea costa in media punti. Il resto della strategia (tempo, soglia) si costruisce su questa aritmetica.

## Dove smette di funzionare
- Il valore atteso non è l'obiettivo reale: l'obiettivo è arrivare ad almeno 18 in tutte e tre le materie. Vicino alla soglia il conteggio dei punti attesi non basta; vedi il Modulo 5 [CALCOLO].
- La tua p è una credenza, non un dato. Una eliminazione sbagliata (hai scartato l'opzione giusta) porta p a zero per quella domanda.
- I suggerimenti sono stati pensati per materiale editoriale; non sono validati sulla prova nazionale e il campione disponibile è piccolo (fino a 90 crocette con chiave, incertezza di circa ±10 punti percentuali) [NON VERIFICATO].
- Se una domanda con due segni non ha punteggio perché è considerata omessa (0) o errata (−0,1) non è scritto [NON VERIFICATO].

- F | Omettere una crocetta toglie 0,1 punti | Un'omessa vale 0 punti; −0,1 è la penalità delle risposte errate.

# Modulo 2 – Completamento
Lettura: 4 minuti

## Regola
**Che cosa chiede la domanda**
- Devi inserire «la risposta corretta mancante, espressiva di un solo e univoco concetto» [CERTO – Allegato 2 punto 4, p. 1].
- Non ci sono opzioni da cui scegliere.

**Come si compila**
- Scrivi la risposta nell'apposito spazio, in STAMPATELLO MAIUSCOLO [CERTO – Allegato 2 punto 16, p. 5].
- Puoi correggere una sola volta: scrivi una diversa risposta nello spazio sottostante e annerisci completamente la precedente [CERTO – Allegato 2 punto 16, p. 5].
- Il cerchietto «non rispondo» è irreversibile, come per le crocette [CERTO – Allegato 2 punto 16, p. 5].

**Punteggio**
- +1 / 0 / −0,1 come per ogni risposta [CERTO – DM 941 art. 8 c.1, p. 11]. Il testo non distingue il formato [NON VERIFICATO sul trattamento della risposta errata a completamento].
- La somma dei punteggi delle crocette e del completamento dà il punteggio d'esame [CERTO – Allegato 2 punto 18, p. 6].

**Che cosa NON sappiamo**
- Il criterio di correzione: se sinonimi, plurali, sigle, errori di ortografia o forme diverse dello stesso termine siano accettati; se esista un limite di caratteri [NON VERIFICATO]. Il limite di 16 caratteri citato nei commenti di un editore non compare nell'Allegato 2 [NON VERIFICATO].
- Il tempo che richiede questo formato rispetto alle crocette [NON VERIFICATO].

**Suggerimenti**
- Rispondi se riesci a richiamare un candidato concreto con una probabilità di aver ragione di almeno il 9,1% (il pareggio del Modulo 1); non tirare a indovinare, perché a caso la probabilità di azzeccare è prossima a zero [EURISTICA; il criterio di correzione è NON VERIFICATO].
- Scrivi UNA sola risposta, un solo concetto, leggibile e dentro lo spazio. Non scrivere due alternative [EURISTICA: la risposta attesa è un solo concetto; cosa succeda con due risposte non è scritto].
- Se non sei sicuro della forma esatta di un termine, scrivilo per esteso piuttosto che abbreviarlo [EURISTICA].
- Considera nella tua stima anche il rischio che la forma che scrivi non coincida con quella attesa: abbassa p di conseguenza [EURISTICA].

## Perché vale
Un terzo dei quesiti (10 su 31) ha questo formato. La logica di convenienza è quella del Modulo 1, ma senza il +0,12 del caso: qui il valore dipende interamente da ciò che sai richiamare.

## Dove smette di funzionare
- Tutto ciò che riguarda il criterio di correzione è ignoto: i suggerimenti sono prudenti, non verificati.
- Nei libri di esercizi il completamento si digita o si scrive in modo libero; in esame si scrive a mano in maiuscolo: il tempo reale può differire [NON VERIFICATO].
- La penalità per una risposta a completamento errata è letta alla lettera dall'art. 8 c.1; una diversa applicazione non è esclusa [NON VERIFICATO].

## Verifica

- F | Puoi correggere una risposta a completamento quante volte vuoi | Una sola volta, scrivendo nello spazio sottostante e annerendo la precedente.
- V | Nei testi ufficiali letti non è scritto se un sinonimo viene accettato | Il criterio di correzione del completamento non è indicato.

- V | La domanda a completamento chiede un solo e univoco concetto | Allegato 2 punto 4.
- F | Il cerchietto di una domanda a completamento si può annullare dopo averlo barrato | Una volta apposto non è più modificabile.

# Modulo 3 – Tempo
Lettura: 5 minuti

## Regola
**I numeri di partenza**
- 50 minuti = 3000 secondi per 31 domande [CERTO – DM 941 art. 7 c.3, p. 10].
- Senza riserva sono 96,8 secondi in media per domanda [CALCOLO: 3000 / 31].

**Regola del ritmo** [EURISTICA: scelta di strategia, non regola ufficiale; parametri modificabili nel Cronometro]
- Tieni una riserva di 180 secondi per barrare i cerchietti delle omesse (irreversibili) e per l'ultimo controllo del modulo.
- Budget per domanda = (3000 − riserva) / 31: con riserva 180 s sono 90,97 s [CALCOLO].
- Limite morbido per una domanda: il doppio del budget, cioè 181,9 s con riserva 180 s [CALCOLO]. Oltre quel limite decidi: rispondi con la tua migliore stima, oppure lascia e passa [EURISTICA].
- Il valore di 180 secondi è una scelta del progetto, non misurata su studenti [EURISTICA].

|---|---|---|
| 10 | 6 | 6 |
| 20 | 13 | 12 |
| 30 | 19 | 18 |
| 40 | 26 | 24 |

Parte intera di (minuti × 60) / budget, con budget 90,97 s e 96,77 s [CALCOLO].

**Quanto costa non finire** (le domande non lette sono omesse)

| Domande non lette | Risposte date | Giuste minime per 18,0 | Errori ammessi |

| 0 | 31 | 20 | 11 |
| 1 | 30 | 20 | 10 |

| 5 | 26 | 19 | 7 |
| 10 | 21 | 19 | 2 |
| 11 | 20 | 19 | 1 |
| 12 | 19 | 19 | 0 |
| 13 | 18 | 18 | 0 |
| 14 o più | 17 o meno | non raggiungibile | – |

Con A risposte date servono giuste C tali che 11·C − A ≥ 180 [CERTO – DM 941 art. 8 c.1 e c.3, p. 11; CALCOLO]. Con 14 domande non lette il massimo ottenibile è 17 punti, sotto la soglia.

- Finire la prova conta più di scegliere con cura cosa omettere: nelle simulazioni su studenti ipotetici (non reali) il calo di probabilità di superare per le domande non lette supera il guadagno di omettere con criterio [STIMA].

**Altre regole di tempo**
- 30 minuti di intervallo tra una prova e l'altra [CERTO – Allegato 2 punto 6, p. 2].
- Per invalidità o disabilità il tempo aggiuntivo non può superare il 50% (fino a 75 minuti); per i DSA è al massimo il 30% (fino a 65 minuti) [CERTO – Allegato 2 punto 7, p. 3; CALCOLO: 50 × 1,5 e 50 × 1,3]. Il tempo effettivo è stabilito dalla tua università.

## Perché vale
Con 31 domande in 50 minuti il rischio principale è consumare troppo tempo su poche domande [EURISTICA]. I checkpoint ti dicono a ogni 10 minuti se sei in anticipo o in ritardo, e la riserva protegge le operazioni irreversibili sul modulo.

## Dove smette di funzionare
- La regola assume tempo uniforme per ogni domanda e per ogni formato. Il tempo reale per formato non è noto [NON VERIFICATO].
- Il tempo di allenamento senza pressione può non valere in esame [NON VERIFICATO].
- Non è indicato se le operazioni sul modulo (etichette, consegna) rientrino nei 50 minuti [NON VERIFICATO].
- Il trattamento di una domanda né risposta né barrata non è specificato: per questo la riserva include la barratura delle omesse [NON VERIFICATO].

- F | Con riserva di 180 secondi il budget è di 100 secondi per domanda | È (3000 − 180) / 31 = 90,97 secondi.

# Modulo 4 – Giornata d'esame
Lettura: 5 minuti

## Regola
**Durata e presenza**
- Tre prove da 50 minuti con 30 minuti di intervallo tra una prova e l'altra: almeno 210 minuti di prove e intervalli (3×50 + 2×30) [CERTO – Allegato 2 punto 6, p. 2; CALCOLO]. A questi si aggiungono le operazioni d'aula, la cui durata non è indicata [NON VERIFICATO].
- Devi presenziare per tutta la durata delle prove, anche se non devi sostenere tutti gli esami [CERTO – Allegato 2 punto 6, p. 2].
- Per chi ha tempo aggiuntivo, i 30 minuti di intervallo decorrono dopo il tempo aggiuntivo [CERTO – Allegato 2 punto 7, p. 3].
- L'ordine delle tre materie non è indicato [NON VERIFICATO].

**Prima della prova**
- Il Presidente della Commissione identifica gli studenti e consegna la scheda anagrafica precompilata; poi sorteggia quattro studenti per verificare l'integrità delle scatole; solo dopo viene consegnato il plico della prima prova [CERTO – Allegato 2 punto 12, p. 4].
- Porta un documento di identità valido: l'identificazione è prevista, ma il documento richiesto non è indicato nei testi letti [EURISTICA; NON VERIFICATO]. Controlla la convocazione della tua università.

**Che cosa trovi nel plico**
- Fogli con le domande (con il codice del plico), due fogli di brutta copia, il modulo risposte con lo stesso codice, un foglio con il codice del plico [CERTO – Allegato 2 punto 14, p. 4].
- Se qualcosa non va nel plico (pagine mancanti, difetti), segnalalo subito al Presidente o al Responsabile d'aula: verifica e, se necessario, sostituisce il plico per intero [CERTO – Allegato 2 punti 13–14, p. 4].

**Il modulo risposte e le etichette**
- Inizio prova: apponi una delle quattro etichette adesive sulla scheda anagrafica. Fine di ogni prova: una etichetta sul relativo modulo risposte. Controlla che i codici coincidano e firma in calce alla scheda anagrafica [CERTO – Allegato 2 punto 16, p. 5].
- A conclusione di ogni prova inserisci il modulo risposte nel contenitore chiuso [CERTO – Allegato 2 punto 16, p. 5]. Dopo non puoi più tornare su quella prova.
- Non è indicato se applicare le etichette rientri nei 50 minuti: chiedilo al Presidente o al Responsabile d'aula all'inizio [EURISTICA; NON VERIFICATO].
- I fogli con le domande restano all'università: non puoi portarli via [CERTO – Allegato 2 punto 17, p. 5]. Puoi invece visualizzare e scaricare l'immagine del tuo modulo risposte dall'area personale [CERTO – Allegato 2 punto 24, p. 7].

**Dopo la prova**
- Il Ministero pubblica solo il punteggio, in ordine di codice etichetta [CERTO – Allegato 2 punto 20, p. 6]. Tu consulti i tuoi punteggi nell'area personale di Universitaly, con autenticazione a due fattori; gli studenti italiani accedono con SPID o CIE [CERTO – Allegato 2 punto 24, p. 7].
- Verifica prima degli esiti che SPID o CIE funzionino [EURISTICA].

**Se hai invalidità, legge 104 o DSA**
- Devi presentare la certificazione all'università nel corso del semestre filtro e comunque non meno di 15 giorni prima della data delle prove [CERTO – Allegato 2 punto 7, pp. 2–3]. Per l'appello del 10/12/2026 significa non oltre il 25/11/2026 [CALCOLO sulla data SEU].
- Tempo aggiuntivo: fino al 50% per invalidità o 104; fino al 30% per DSA [CERTO – Allegato 2 punto 7, p. 3].

## Perché vale
Conoscere in anticipo i passaggi riduce il rischio di perdere minuti o di commettere un errore irreversibile (etichette, cerchietti, correzione unica) in una giornata lunga.

## Dove smette di funzionare
- L'organizzazione concreta (orari, aule, oggetti ammessi, uscite durante gli intervalli) dipende dall'ateneo e dalla convocazione, non dal decreto: nei testi letti non sono scritti [NON VERIFICATO].
- Non è indicato se si possa scrivere sul foglio con le domande: per le note provvisorie la fonte certa sono i due fogli di brutta copia [CERTO – Allegato 2 punto 14, p. 4].
- Le date vengono da SEU, non dal DM 941: verifica quelle della tua università [CERTO – fonte SEU].

## Verifica
- V | Tra l'inizio della prima prova e la fine dell'ultima passano almeno 210 minuti | 3 × 50 + 2 × 30, esclusi tempi aggiuntivi e operazioni d'aula.
- F | Se hai finito gli esami che ti interessano puoi andare via prima | Devi presenziare per tutta la durata delle prove (Allegato 2 punto 6).
- V | Il modulo risposte di ogni prova va nel contenitore alla fine di quella prova | Allegato 2 punto 16.
- F | Puoi usare la penna che preferisci | Solo la penna nera data in dotazione.
- V | I fogli con le domande restano all'università | Allegato 2 punto 17.
- F | L'ordine delle prove è Chimica, Fisica, Biologia | L'ordine non è indicato nei testi letti.

# Modulo 5 – Obiettivo reale (tre esami)
Lettura: 5 minuti

## Regola
**La graduatoria**
- Entrano in graduatoria gli studenti che hanno superato almeno uno dei tre esami [CERTO – DM 941 art. 10 c.1, p. 13]. Con nessun esame superato non si entra.
- Sezione 1: 18/30 o più in tutti e tre gli esami (+300 punti). Sezione 2: 18/30 o più in due esami su tre (+200). Sezione 3: in uno solo (+100). Il punteggio è il bonus più la somma dei voti accettati [CERTO – art. 10 c.2, pp. 13–14].

| Esami superati | Bonus | Intervallo del punteggio finale |
|---|---|---|
| 3 su 3 | +300 | 354 – 393 |
| 2 su 3 | +200 | 236 – 262 |
| 1 su 3 | +100 | 118 – 131 |

Estremi: bonus più il minimo 18 per esame superato e il massimo 31 per esame (93 in tutto, art. 8 c.2) [CALCOLO]. Gli intervalli non si sovrappongono: chi supera tre esami precede sempre chi ne supera due, anche con voti più alti [CERTO – ordine delle sezioni, art. 10 c.1; CALCOLO sugli intervalli].

**La conseguenza operativa**
- Passare da 2 a 3 esami superati vale almeno 118 punti (100 di bonus più almeno 18 dell'esame in più), mentre alzare un esame già superato da 18 a 31 ne vale al massimo 13 [CALCOLO].
- Quando devi scegliere dove far valere un punto, un punto che porta una materia da sotto a sopra 18 vale di più di un punto in una materia già sopra [EURISTICA: conseguenza della regola; non è un piano di studio].

**Due prove, accettazione, rifiuto**
- Se sostieni entrambe le prove di un insegnamento prevale la più alta, purché sia almeno 18/30: un secondo tentativo non può abbassare un voto già valido [CERTO – art. 8 c.4, p. 11].
- Per ogni insegnamento con voto da 18 in su devi accettare o rifiutare il voto entro le 23:59 (ora italiana) del giorno dopo la pubblicazione degli esiti della seconda prova. Se non fai nulla il voto è accettato [CERTO – art. 8 c.5, p. 11; Allegato 2 punto 23, p. 7]. Con esiti il 20/01/2027 il termine è il 21/01/2027 alle 23:59 [CALCOLO sulla data SEU].
- Conta per graduatoria solo il voto accettato [CERTO – art. 8 c.5, p. 11].
- Se rifiuti un voto e ti collochi in posizione utile, devi conseguire i CFU di quell'insegnamento nell'ateneo di assegnazione [CERTO – art. 8 c.6, p. 11]. Prima di rifiutare leggi gli artt. 12 e 13 del DM 941 (pp. 16–17).

**Il punto 18 non è sempre il punto che conta**
- Giuste minime per 18,0 con A risposte date (A = giuste + errate): A = 18 → 18; A = da 19 a 29 → 19; A = 30 o 31 → 20 [CERTO – DM 941 art. 8 c.1 e c.3; CALCOLO: 11·C − A ≥ 180].
- Con 29 risposte puoi sbagliare al massimo 10; con 30 risposte sempre 10, ma servono 20 giuste; con 31 risposte puoi sbagliare 11 [CALCOLO]. Quindi la trentesima risposta non allarga il margine di errore: richiede una giusta in più.
- Massimizzare i punti attesi non coincide con massimizzare la probabilità di arrivare a 18: nelle simulazioni su studenti ipotetici la differenza tra «rispondi a 29» e «rispondi a tutte» è piccola e incerta [STIMA]. Nessuna regola fissa deriva da qui.

**Esempio di valutazione dei tre esami**
- Esame A: 20 giuste e 11 errate = 18,9. Esame B: 19 giuste e 10 errate = 18,0. Esame C: 18 giuste e nessuna errata = 18,0. Tre voti da 18 o più: sezione 1 (+300) [CALCOLO].
- Un esame con 18 giuste e 1 errata vale 17,9: non supera [CALCOLO; art. 8 c.3].

## Perché vale
La graduatoria ordina prima per numero di esami superati e poi per punteggio: l'obiettivo prioritario è non lasciare indietro nessuno dei tre esami, e solo dopo alzare i voti.

## Dove smette di funzionare
- Superare tre esami non garantisce un posto: i posti dipendono da punteggio e graduatoria nazionale; il 22/01/2027 alle 16:00 è la data di pubblicazione indicata [CERTO – fonte SEU].
- Nei testi letti non è scritto se la somma dei voti in graduatoria usi punteggi arrotondati o no; non incide sull'ordine tra sezioni [NON VERIFICATO].
- Questa release non stima la tua probabilità di superare: nessun numero qui è una previsione sul tuo risultato [NON VERIFICATO].

## Verifica
- V | Chi supera tre esami precede sempre chi ne supera due | 354 (minimo con tre esami) è maggiore di 262 (massimo con due).
- F | Se non rispondi entro il termine il voto viene scartato | Il silenzio equivale ad accettazione (art. 8 c.5).
- V | Un voto rifiutato non conta per l'inserimento e la collocazione in graduatoria | Rileva solo il voto accettato (art. 8 c.5).
- F | Chi supera un solo esame su tre non entra in graduatoria | Entra nella sezione 3, con +100 e recupero dei CFU degli altri (art. 10 c.1).
- V | Con 30 risposte servono 20 giuste per arrivare a 18,0 | 11 × 20 − 30 = 190 ≥ 180, mentre 11 × 19 − 30 = 179 non basta.
- F | Con 18 giuste e 1 errata si supera l'esame | 18 − 0,1 = 17,9, sotto la soglia di 18,0.

# Guida d'uso

## Che cosa fa l'app e che cosa no
- L'app non contiene quesiti e non spiega teoria: non sostituisce lo studio né i tuoi libri.
- Serve per tre cose: capire le regole e la strategia di questa prova (i moduli), calcolare il punteggio e il margine d'errore (Calcolatore), allenare il ritmo (Cronometro).
- Non prevede il tuo voto e non promette punti: l'effetto dell'app non è stato misurato [NON VERIFICATO].

## Come usare gli esercizi del libro
- Riconosci i due formati nel libro: esercizi con 5 opzioni (come le 21 crocette) e esercizi a risposta libera (come i 10 a completamento). Gli esercizi degli editori NON sono quesiti d'esame e lo stile dei quesiti nazionali 2026 è ignoto [NON VERIFICATO].
- Prima di guardare la soluzione decidi la risposta e quanto sei sicuro: alta (almeno 80%), media (tra 50% e 80%), bassa (meno del 50%). Se la sicurezza dichiarata coincide con gli esiti, la tua stima di p è affidabile; se no, è da correggere [EURISTICA].
- Per allenare il completamento con un esercizio a crocette, copri le opzioni e scrivi la risposta in maiuscolo; poi confronta [EURISTICA].
- Ogni tanto scrivi a mano in stampatello maiuscolo, come in esame [EURISTICA].
- Per allenare il tempo usa il Cronometro: 31 domande, 50 minuti, riserva 180 secondi. Il tempo di allenamento senza pressione può non valere in esame [NON VERIFICATO].
- Quando sbagli, annota il tipo di errore: «non lo sapevo», «lo sapevo ma ho sbagliato» (lettura, calcolo, distrazione), «tempo» [EURISTICA]. Serve a capire dove perdere meno punti, non a pianificare lo studio.
- Le soluzioni di un libro possono contenere refusi o errori: se una soluzione non ti convince, verificala con il docente o con un'altra fonte [CONOSCENZA GENERALE].
- Gli argomenti dell'esame seguono i Syllabus 2026 [CERTO – Allegato 2 punto 3, p. 1; DM 941 art. 13 c.2, p. 17].

## Che cosa dice la ricerca sul modo di studiare
- Fare test su ciò che si studia e distribuire lo studio nel tempo hanno un'utilità alta; rileggere, sottolineare e riassumere hanno un'utilità bassa [CONOSCENZA GENERALE – Dunlosky et al. 2013, sintesi APS].
- Queste conclusioni vengono dalla ricerca generale sull'apprendimento, non da dati su questa prova né sull'app [NON VERIFICATO]. L'organizzazione del tuo tempo di studio resta tua: l'app non propone un piano.

## Come usare il Registro
- Registra voce per voce: materia, formato, unità (facoltativa), la confidenza scelta prima di guardare la soluzione, poi l'esito. L'app non può controllare che la confidenza sia davvero scelta prima: se la cambi dopo, i Livelli non misurano più nulla.
- Se rifai esercizi che hai già svolto, accendi l'interruttore «Ripasso»: quelle voci non contano per la calibrazione. Solo le prime risposte contano. L'interruttore si spegne ogni volta che apri l'app.
- L'unità è quella del Syllabus (UD1–UD7), non il capitolo del libro: la scegli tu dai titoli mostrati. Se non sei sicuro, lasciala su «Nessuna»: la voce conta comunque nei Livelli.
- La scheda Analisi ha due parti. I Livelli mostrano la percentuale di giuste per livello di confidenza solo con almeno 25 prime risposte per livello, con intervallo di incertezza. Sotto 25 vedrai «dati insufficienti»: non è un errore, è una cautela [CALCOLO].
- La parte Unità serve con molte risposte: a 15 risposte al giorno per 30 giorni ne hai circa 21 per unità, sotto la soglia di 25 [STIMA]. Aspettati spesso «dati insufficienti».
- Il Registro non confronta le tue risposte con una chiave: l'esito lo valuti tu, con la soluzione del libro.

## I tuoi dati
- I dati restano nel browser del tuo dispositivo. Usa Esporta con regolarità per averne una copia, e Importa per ripristinarla.
- Su alcuni browser (Safari) i dati di un sito possono essere cancellati dopo 7 giorni senza visite [NON VERIFICATO]: esporta spesso.
- Apri l'app sempre dal link, non da un file ricevuto: da file locale i progressi possono non essere salvati.

## Prima dell'esame
- Rileggi i Moduli 0, 3 e 4, e usa il Calcolatore con alcuni esempi per memorizzare le giuste minime: A = 18 → 18; da 19 a 29 → 19; 30 o 31 → 20.
- Verifica che SPID o CIE funzionino e controlla la convocazione della tua università [EURISTICA].

// ------------------------------------------------------------------ Corso
function rCorso(m) {
  m.appendChild(h('h2', { text: 'Corso' }));
  const pv = provvisorio(); if (pv) m.appendChild(pv);
  m.appendChild(h('p', { class: 'muted small', text: 'Contenuti: revisione ' + (CONTENUTI.revisione || 'non indicata') + '.' }));
  for (const el of elementiCorso()) {
    const titolo = el.id === 'guida' ? el.titolo : 'Modulo ' + el.n + ' – ' + el.titolo;
    m.appendChild(h('button', { type: 'button', class: 's blocco', 'data-modulo': el.id, on: { click: () => vai('modulo', el.id) } }, titolo,
      el.lettura ? h('span', { class: 'muted small', text: ' · ' + el.lettura + ' min' }) : null,
      el.id !== 'guida' ? h('span', { class: 'stato' + (letto(el.id) ? ' letto' : ''), text: letto(el.id) ? 'letto' : 'da leggere' }) : null));
  }
}

function bloccoDom(b) {
  if (b.t === 'p') return h('p', {}, inline(b.tok));
  if (b.t === 'ul') return h('ul', {}, b.voci.map((v) => h('li', {}, inline(v))));
  const t = h('table');
  if (b.intest) t.appendChild(h('thead', {}, h('tr', {}, b.intest.map((c) => h('th', {}, inline(c))))));
  t.appendChild(h('tbody', {}, b.righe.map((r) => h('tr', {}, r.map((c) => h('td', {}, inline(c)))))));
  return h('div', { class: 'tabwrap' }, t);
}

function rModulo(m) {
  const el = trovaElemento(ui.modulo);
  if (!el) { vai('corso'); return; }
  m.appendChild(h('div', { class: 'riga' }, h('button', { type: 'button', class: 't', text: '← Corso', on: { click: () => vai('corso') } })));
  m.appendChild(h('h2', { text: el.id === 'guida' ? el.titolo : 'Modulo ' + el.n + ' – ' + el.titolo }));
  const pv = provvisorio(); if (pv) m.appendChild(pv);
  if (el.lettura) m.appendChild(h('p', { class: 'muted small', text: 'Lettura: ' + el.lettura + ' minuti' }));
  for (const s of el.sezioni) {
    m.appendChild(h('h3', { text: s.titolo }));
    s.blocchi.forEach((b) => m.appendChild(bloccoDom(b)));
  }
  if (el.verifica && el.verifica.length) {
    m.appendChild(h('h3', { text: 'Verifica' }));
    m.appendChild(h('p', { class: 'muted small', text: 'Vero o falso? Le risposte non vengono salvate.' }));
    el.verifica.forEach((v, i) => m.appendChild(rVerifica(el.id, i, v)));
  }
  if (el.id !== 'guida') {
    const l = letto(el.id);
    m.appendChild(h('div', { class: 'riga' }, h('button', { type: 'button', class: l ? 's' : 'p', id: 'b-letto', text: l ? 'Letto ✓ – segna come da leggere' : 'Segna come letto', on: { click: () => {
      stato.letti = l ? stato.letti.filter((x) => x !== el.id) : stato.letti.concat([el.id]).sort(); salva(); render();
    } } })));
  }
}

function rVerifica(id, i, v) {
  const k = id + '#' + i, data = ui.verifica[k];
  const box = h('div', { class: 'ver', 'data-verifica': k }, h('p', {}, inline(v.affermazione)));
  const rispondi = (x) => { ui.verifica[k] = x; render(); const el = document.querySelector('[data-verifica="' + k + '"]'); if (el) el.scrollIntoView({ block: 'nearest' }); };
  box.appendChild(h('div', { class: 'riga' },
    h('button', { type: 'button', class: 's', text: 'Vero', disabled: !!data, on: { click: () => rispondi('V') } }),
    h('button', { type: 'button', class: 's', text: 'Falso', disabled: !!data, on: { click: () => rispondi('F') } })));
  if (data) {
    const giusta = (data === 'V') === v.vero;
    box.appendChild(h('div', { class: 'esito' },
      h('p', { class: giusta ? 'esito-ok' : 'esito-ko', text: giusta ? 'Giusto' : 'Sbagliato' }),
      h('p', {}, 'La risposta corretta era ' + (v.vero ? 'Vero' : 'Falso') + '. ', inline(v.spiegazione))));
  }
  return box;
}

// ------------------------------------------------------------------ Registro (BRIEF passo2 §4.2)
const sessione = () => stato.impostazioni.sessione;
const NOME_FORMATO_BREVE = { C: 'Crocetta', COMP: 'Completamento' };
const nomeUnita = (mat, u) => L.nomeUnita(TITOLI, mat, u);
function oraVoce(ts) { const d = new Date(ts), p = (n) => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); }
function descrizioneVoce(v) {
  return L.NOME_MATERIA[v.materia] + ' · ' + NOME_FORMATO_BREVE[v.formato] + ' · ' + (v.unita ? 'UD' + v.unita : 'senza unità') + ' · confidenza ' + L.NOME_LIVELLO[v.livello]
    + (v.esito === null ? '' : ' · ' + (v.esito ? 'giusta' : 'sbagliata')) + ' · ' + oraVoce(v.ts) + (v.prima ? '' : ' · ripasso');
}
function applicaRegistro(r) { stato.registro = r.registro; salva(); render(); }

function rRegistro(m) {
  m.appendChild(h('p', { class: 'small', text: 'Registra una risposta ai tuoi esercizi del libro. L\'app non mostra quesiti e non conosce le soluzioni: l\'esito lo giudichi tu.' }));

  const setS = (k, v) => { s[k] = v; salva(); render(); };
  const seg = (id, opzioni, corrente, onSet) => h('div', { class: 'seg', id }, opzioni.map(([k, t]) => h('button', { type: 'button', text: t, 'data-v': String(k), 'aria-pressed': corrente === k ? 'true' : 'false', on: { click: () => onSet(k) } })));
  const sel = h('select', { id: 's-unita', 'aria-label': 'Unità' }, h('option', { value: '', text: 'Nessuna' }),
    [1, 2, 3, 4, 5, 6, 7].map((u) => h('option', { value: String(u), text: s.materia ? nomeUnita(s.materia, u) : 'UD' + u })));
  sel.value = s.unita === null ? '' : String(s.unita);
  sel.addEventListener('change', () => setS('unita', sel.value === '' ? null : Number(sel.value)));
  const rip = h('input', { type: 'checkbox', id: 's-ripasso', checked: ui.ripasso ? true : null, on: { change: (e) => { ui.ripasso = e.target.checked; render(); } } });
  rip.checked = ui.ripasso;
  m.appendChild(h('div', { class: 'card sessione' },
    h('label', { text: 'Materia (obbligatoria)' }), seg('s-materia', L.MATERIE.map((k) => [k, L.NOME_MATERIA[k]]), s.materia, (k) => setS('materia', k)),
    h('label', { text: 'Formato' }), seg('s-formato', L.FORMATI.map((k) => [k, L.NOME_FORMATO[k]]), s.formato, (k) => setS('formato', k)),
    h('div', { class: 'griglia2' },
      h('div', {}, h('label', { for: 's-unita', text: 'Unità (facoltativa)' }), sel),
      h('label', { class: 'ripswitch' }, rip, h('span', { class: 'small', text: 'Ripasso (ho già risposto a questi esercizi)' })))));
  if (ui.errReg) m.appendChild(h('p', { class: 'err', role: 'alert', id: 'err-reg', text: ui.errReg }));

  const cor = ui.corrente ? stato.registro.find((x) => x.id === ui.corrente && x.esito === null) : null;
  if (!cor) {
    ui.corrente = null;
    const conf = h('div', { class: 'card conf', id: 'passo1' }, h('h3', { text: 'Prima di guardare la soluzione: quanto sei sicuro/a?' }));
    const bott = [['A', 'Alta – quasi sicuro/a (almeno 80%)'], ['M', 'Media – tra 50% e 80%'], ['B', 'Bassa – meno del 50%, quasi a caso']];
    for (const [l, t] of bott) conf.appendChild(h('button', { type: 'button', class: 'p', text: t, 'data-livello': l, disabled: !s.materia, on: { click: () => {
      const r = L.registraConfidenza(stato.registro, s, l, !ui.ripasso, new Date());
      if (!r.ok) { ui.errReg = r.errore; render(); return; }
      ui.errReg = null; ui.corrente = r.voce.id; applicaRegistro(r);
    } } }));
    if (!s.materia) conf.appendChild(h('p', { class: 'muted small', text: 'Scegli prima la materia.' }));
    m.appendChild(conf);
  } else {
    const dec = (esito) => { const r = L.impostaEsito(stato.registro, cor.id, esito); ui.corrente = null; if (r.ok) applicaRegistro(r); else render(); };
    m.appendChild(h('div', { class: 'card conf', id: 'passo2' }, h('h3', { text: 'Ora guarda la soluzione sul libro: la tua risposta era giusta?' }),

      h('button', { type: 'button', class: 'p', id: 'e-giusta', text: 'Giusta', on: { click: () => dec(true) } }),
      h('button', { type: 'button', class: 'p', id: 'e-sbagliata', text: 'Sbagliata', on: { click: () => dec(false) } }),
      h('button', { type: 'button', class: 's', id: 'e-dopo', style: 'width:100%;text-align:left', text: 'Decido dopo', on: { click: () => { ui.corrente = null; render(); } } })));
  }

  const agg = L.aggrega_registro(stato.registro);
  m.appendChild(h('p', { class: 'prog', id: 'riepilogo-reg', text: 'Prime risposte valutate: ' + agg.totale_prime + ' · in sospeso: ' + agg.in_sospeso + ' · ripassi: ' + agg.ripassi }));

        h('button', { type: 'button', class: 'p', 'data-azione': 'elimina-si', text: 'Sì, elimina', on: { click: () => { ui.confermaElimina = null; if (ui.corrente === v.id) ui.corrente = null; applicaRegistro(L.eliminaVoce(stato.registro, v.id)); } } }),
        h('button', { type: 'button', class: 's', text: 'Annulla', on: { click: () => { ui.confermaElimina = null; render(); } } }))
      : h('div', { class: 'riga' }, bottoni));
  const elim = (v) => h('button', { type: 'button', class: 't', 'data-azione': 'elimina', text: 'Elimina', on: { click: () => { ui.confermaElimina = v.id; render(); } } });

      h('button', { type: 'button', class: 's', 'data-azione': 'giusta', text: 'Giusta', on: { click: () => applicaRegistro(L.impostaEsito(stato.registro, v.id, true)) } }),

    m.appendChild(c);

    for (const v of ult) c.appendChild(riga(v, [h('button', { type: 'button', class: 's', 'data-azione': 'correggi', text: 'Correggi esito', on: { click: () => applicaRegistro(L.correggiEsito(stato.registro, v.id)) } }), elim(v)]));
    c.appendChild(h('p', { class: 'muted small', text: 'La confidenza non si può cambiare: per un errore, elimina la voce e registrala di nuovo. L\'app non può impedirti di rifarla dopo aver visto la soluzione.' }));
    m.appendChild(c);
  }
}
