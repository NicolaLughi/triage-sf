// ---- calcolatore
function campoNumero(id, etichetta, onInput) {
  return h('div', {}, h('label', { class: 'campo', for: id, text: etichetta }),
    h('input', { type: 'text', id, inputmode: 'numeric', autocomplete: 'off', pattern: '[0-9]*', on: { input: onInput } }));
}
const valoreCampo = (id) => L.leggiIntero(document.getElementById(id).value);

function righeEsito(r) {
  const out = [];
  out.push(h('p', { class: 'prog' }, 'Risposte date: ' + r.A + ' (giuste ' + r.C + ' + errate ' + r.E + '); omesse: ' + r.omesse + '.'));
  out.push(h('p', { class: 'prog' }, h('strong', { text: 'Punteggio: ' + r.punteggio }), ' · soglia 18,0, non arrotondato: ',
    h('span', { class: r.superato ? 'esito-ok' : 'esito-ko', text: r.superato ? 'SUPERATO' : 'NON SUPERATO' })));
  out.push(r.raggiungibile
    ? h('p', { class: 'prog', text: 'Con ' + r.A + ' risposte servono almeno ' + r.cmin + ' giuste; errori ammessi: ' + r.ammessi + '.' })
    : h('p', { class: 'prog', text: 'Con meno di 18 risposte la soglia 18,0 non è raggiungibile (anche tutte giuste, il massimo è ' + r.A + ',0).' }));
  return out;
}

function aggiornaUno() {
  const box = document.getElementById('res-uno'); svuota(box);
  const c = valoreCampo('in-c'), e = valoreCampo('in-e');
  if (c.stato === 'errore' || e.stato === 'errore') { box.appendChild(h('p', { class: 'err', role: 'alert', text: 'Giuste ed errate devono essere numeri interi, 0 o più (solo cifre).' })); return; }
  if (c.stato === 'vuoto' && e.stato === 'vuoto') { box.appendChild(h('p', { class: 'muted', text: 'Inserisci giuste ed errate (puoi lasciare vuoto = 0).' })); return; }
  const r = L.calcola(c.valore || 0, e.valore || 0);
  if (!r.ok) { box.appendChild(h('p', { class: 'err', role: 'alert', text: r.errore })); return; }
  righeEsito(r).forEach((x) => box.appendChild(x));
}

function aggiornaEsame() {
  const box = document.getElementById('res-esame'); svuota(box);
  const coppie = []; let vuote = 0;
  for (let i = 0; i < 3; i++) {
    const c = valoreCampo('ex-c' + i), e = valoreCampo('ex-e' + i);
    if (c.stato === 'errore' || e.stato === 'errore') { box.appendChild(h('p', { class: 'err', role: 'alert', text: L.MATERIE_ESAME[i] + ': giuste ed errate devono essere numeri interi, 0 o più (solo cifre).' })); return; }
    if (c.stato === 'vuoto' && e.stato === 'vuoto') vuote++;
    coppie.push({ C: c.valore || 0, E: e.valore || 0 });
  }
  if (vuote === 3) { box.appendChild(h('p', { class: 'muted', text: 'Inserisci giuste ed errate per le tre materie.' })); return; }
  const r = L.esameCompleto(coppie);
  if (!r.ok) { box.appendChild(h('p', { class: 'err', role: 'alert', text: r.errore })); return; }
  r.sezioni.forEach((s) => box.appendChild(h('p', { class: 'prog' }, s.nome + ': ' + s.punteggio + ' – ', h('span', { class: s.superato ? 'esito-ok' : 'esito-ko', text: s.superato ? 'superato' : 'non superato' }))));
  box.appendChild(h('p', { class: 'prog' }, h('strong', { text: r.testo.charAt(0).toUpperCase() + r.testo.slice(1) }), ' → sezione di graduatoria: +' + r.bonus + '.'));
}

function rCalcolatore(m) {
  const uno = h('div', { class: 'card' }, h('h3', { text: 'Punteggio di un esame (31 quesiti)' }),
    h('p', { class: 'small' }, '+1 giusta, 0 omessa, −0,1 errata; si supera con almeno 18,0, non arrotondato. ', badge('CERTO', 'CERTO – DM 941 art. 8 c.1 e c.3')),
    h('div', { class: 'griglia2' }, campoNumero('in-c', 'Giuste', aggiornaUno), campoNumero('in-e', 'Errate', aggiornaUno)),
    h('div', { class: 'risultato', id: 'res-uno', 'aria-live': 'polite' }));
  m.appendChild(uno);
  const tb = h('table', { id: 'tab-cmin' }, h('thead', {}, h('tr', {}, ['Risposte date', 'Giuste minime', 'Errori ammessi'].map((x) => h('th', { text: x })))),
    h('tbody', {}, L.tabellaCmin().map((r) => h('tr', {}, h('td', { class: 'prog', text: String(r.A) }), h('td', { class: 'prog', text: String(r.cmin) }), h('td', { class: 'prog', text: String(r.ammessi) })))));
  m.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Giuste minime per numero di risposte' }),
    h('p', { class: 'small' }, 'Si supera se 11·giuste − risposte ≥ 180. Sotto 18 risposte la soglia non è raggiungibile. ', badge('CERTO', 'CERTO – DM 941 art. 8 c.1 e c.3'), ' ', badge('CALCOLO', 'CALCOLO – motore, c_min')),
    h('div', { class: 'tabwrap' }, tb)));
  const righe = [0, 1, 2].map((i) => h('div', {}, h('h3', { text: L.MATERIE_ESAME[i], style: 'margin-top:8px' }),
    h('div', { class: 'griglia2' }, campoNumero('ex-c' + i, 'Giuste', aggiornaEsame), campoNumero('ex-e' + i, 'Errate', aggiornaEsame))));
  m.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Esame completo (3 materie)' }),
    h('p', { class: 'small' }, 'Ogni materia è valutata da sola. Sezione di graduatoria: +300 se 3 su 3, +200 se 2 su 3, +100 se 1 su 3. Il punteggio finale con i voti non è calcolato qui. ', badge('CERTO', 'CERTO – DM 941 art. 10')),
    righe, h('div', { class: 'risultato', id: 'res-esame', 'aria-live': 'polite' })));
  aggiornaUno(); aggiornaEsame();
}

// ---- cronometro (il tempo si calcola dagli istanti, non dai tick)
const crono = { fase: 'fermo', inizio: 0, n: 0, riserva: 180, timer: null, lock: null, confermaStop: false, avvisati: {} };

function vibra() { try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) { /* niente */ } }
async function prendiLock() { try { if (navigator.wakeLock && navigator.wakeLock.request) crono.lock = await navigator.wakeLock.request('screen'); } catch (e) { crono.lock = null; } }
function rilasciaLock() { try { if (crono.lock && crono.lock.release) crono.lock.release(); } catch (e) { /* niente */ } crono.lock = null; }
document.addEventListener('visibilitychange', () => {
  if (crono.fase !== 'attivo') return;
  tick();
  if (document.visibilityState === 'visible') prendiLock();
});

function infoParametri(riserva) {
  const p = L.parametriCrono(riserva);
  return 'Budget: ' + L.fmt2(p.budget_s) + ' s per quesito; limite morbido: ' + L.fmt2(p.limite_s) + ' s. Obiettivi: ' +
    p.checkpoint.map((c) => 'minuto ' + c.minuti + ' → ' + c.obiettivo).join(', ') + ' quesiti affrontati.';
}

function avviaCrono() {
  crono.fase = 'attivo'; crono.inizio = Date.now(); crono.n = 0; crono.riserva = stato.impostazioni.riserva; crono.confermaStop = false; crono.avvisati = {};
  prendiLock();
  if (crono.timer) clearInterval(crono.timer);
  crono.timer = setInterval(tick, 250);
  render();
}
function fermaCrono() {
  if (crono.timer) clearInterval(crono.timer);
  crono.timer = null; crono.fase = 'fermo'; crono.confermaStop = false; rilasciaLock(); render();
}
function tick() {
  if (crono.fase !== 'attivo') return;
  const s = L.statoCrono((Date.now() - crono.inizio) / 1000, crono.riserva, crono.n);
  for (const mnt of s.checkpointPassati) if (!crono.avvisati['c' + mnt]) { crono.avvisati['c' + mnt] = 1; vibra(); }
  if (s.inRiserva && !crono.avvisati.r) { crono.avvisati.r = 1; vibra(); }
  if (s.finito) {
    crono.fase = 'finito'; if (crono.timer) clearInterval(crono.timer); crono.timer = null; rilasciaLock(); vibra();
    if (ui.schermata === 'strumenti' && ui.strumento === 'cronometro') render();
    return;
  }
  aggiornaCrono(s);
}
function aggiornaCrono(s) {
  if (crono.fase !== 'attivo') return;
  s = s || L.statoCrono((Date.now() - crono.inizio) / 1000, crono.riserva, crono.n);
  const set = (id, t) => { const e = document.getElementById(id); if (e && e.textContent !== t) e.textContent = t; };
  set('c-tempo', L.mmss(s.rimanente_s));
  set('c-conta', String(crono.n));
  const b = document.getElementById('c-box');
  if (b) {
    b.hidden = !s.box;
    if (s.box) { set('c-box-testo', s.box.testo); }
    else if (s.prossimo) { b.hidden = false; set('c-box-testo', 'Prossimo obiettivo: minuto ' + s.prossimo.minuti + ' ≈ ' + s.prossimo.obiettivo + ' quesiti affrontati.'); }
  }
  const r = document.getElementById('c-riserva-box'); if (r) r.hidden = !s.inRiserva;
}

function rCronometro(m) {
  const riserva = stato.impostazioni.riserva;
  if (crono.fase === 'fermo') {
    const inp = h('input', { type: 'text', id: 'c-riserva-input', inputmode: 'numeric', autocomplete: 'off', value: String(riserva) });
    const info = h('p', { class: 'small prog', id: 'c-info', text: infoParametri(riserva) });
    const errore = h('p', { class: 'err', id: 'c-err', role: 'alert', hidden: true, text: 'La riserva deve essere un intero tra 0 e 600 secondi.' });
    inp.addEventListener('input', () => {
      const v = L.leggiIntero(inp.value);
      if (v.stato === 'ok' && L.validaRiserva(v.valore)) { errore.hidden = true; stato.impostazioni.riserva = v.valore; salva(); info.textContent = infoParametri(v.valore); }
      else errore.hidden = false;
    });
    m.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Cronometro d\'esame (una materia)' }),
      h('p', { class: 'small' }, 'Durata 50:00 per materia, non sospendibile. ', badge('CERTO', 'CERTO – DM 941 art. 7 c.3')),
      h('button', { type: 'button', class: 'p blocco', id: 'c-avvia', text: 'Avvia (50:00)', style: 'text-align:center', on: { click: avviaCrono } }),
      h('label', { class: 'campo', for: 'c-riserva-input', text: 'Riserva finale (secondi, 0–600)' }), inp, errore,
      h('p', { class: 'small muted', style: 'margin-top:8px' }, 'La riserva serve per barrare i cerchietti delle omesse e per l\'ultimo controllo. ', badge('EURISTICA', 'EURISTICA – scelta modificabile')),
      info,
      h('p', { class: 'small muted' }, 'Il cronometro non viene salvato: se chiudi o ricarichi la pagina riparte da zero.')));
    return;
  }
  if (crono.fase === 'finito') {
    m.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Tempo scaduto' }),
      h('div', { class: 'tempo', text: '00:00' }),
      h('p', { id: 'c-finale', text: 'Quesiti affrontati segnati: ' + crono.n + ' su 31.' }),
      h('button', { type: 'button', class: 'p blocco', id: 'c-chiudi', text: 'Chiudi', style: 'text-align:center', on: { click: fermaCrono } })));
    return;
  }
  const card = h('div', { class: 'card' },
    h('div', { class: 'tempo', id: 'c-tempo', 'aria-label': 'Tempo rimanente', text: '50:00' }),
    h('p', { class: 'muted small', style: 'text-align:center', text: 'quesiti affrontati' }),
    h('div', { class: 'conta' },
      h('button', { type: 'button', class: 's', id: 'c-meno', 'aria-label': 'Un quesito in meno', text: '−', on: { click: () => { if (crono.n > 0) { crono.n--; aggiornaCrono(); } } } }),
      h('div', { class: 'n', id: 'c-conta', 'aria-live': 'polite', text: String(crono.n) }),
      h('button', { type: 'button', class: 'p', id: 'c-piu', 'aria-label': 'Un quesito in più', text: '+', on: { click: () => { if (crono.n < M.NQ) { crono.n++; aggiornaCrono(); } } } })),
    h('div', { class: 'box', id: 'c-box', hidden: true }, h('span', { id: 'c-box-testo' }), ' ', badge('EURISTICA')),
    h('div', { class: 'box riserva', id: 'c-riserva-box', hidden: true }, h('strong', { text: 'Riserva: controllo finale' }), '. Barra i cerchietti delle domande che lasci in bianco e ricontrolla. ', badge('EURISTICA')),
    crono.confermaStop
      ? h('div', { class: 'riga' }, h('span', { text: 'Interrompere e azzerare il cronometro?' }),
        h('button', { type: 'button', class: 'p', id: 'c-stop-si', text: 'Sì, interrompi', on: { click: fermaCrono } }),
        h('button', { type: 'button', class: 's', text: 'Continua', on: { click: () => { crono.confermaStop = false; render(); } } }))
      : h('div', { class: 'riga' }, h('button', { type: 'button', class: 't', id: 'c-interrompi', text: 'Interrompi', on: { click: () => { crono.confermaStop = true; render(); } } })));
  m.appendChild(card);
}

// ------------------------------------------------------------------ Dati
function rDati(m) {
  m.appendChild(h('h2', { text: 'Dati' }));
  if (ui.msg) m.appendChild(h('div', { class: 'nota', role: 'status', id: 'msg', text: ui.msg }));
  const fp = h('input', { type: 'file', id: 'f-progressi', accept: '.json,application/json', style: 'display:none', on: { change: (e) => importaProgressiFile(e.target.files[0]) } });
  const ta = h('textarea', { id: 't-incolla', placeholder: 'Oppure incolla qui il testo copiato con «Copia testo»', 'aria-label': 'Testo dei progressi da importare' });
  m.appendChild(h('div', { class: 'card' }, h('h3', { text: 'I tuoi progressi' }),
    h('p', { id: 'info-progressi', text: 'Moduli letti: ' + stato.letti.length + ' · voci del registro: ' + stato.registro.length + ' · riserva del cronometro: ' + stato.impostazioni.riserva + ' s.' }),
    fp,
    h('div', { class: 'riga' },
      h('button', { type: 'button', class: 'p', id: 'b-esporta', text: 'Esporta (.json)', on: { click: esporta } }),
      h('button', { type: 'button', class: 's', id: 'b-copia', text: 'Copia testo', on: { click: copiaTesto } }),
      h('button', { type: 'button', class: 's', id: 'b-importa', text: 'Importa da file', on: { click: () => fp.click() } })),
    ta,
    h('div', { class: 'riga' }, h('button', { type: 'button', class: 's', id: 'b-importa-testo', text: 'Importa dal testo incollato', on: { click: () => importaProgressiTesto(ta.value) } })),
    h('p', { class: 'muted small', text: 'L\'importazione unisce i moduli letti e le voci del registro (per identificativo: se una voce è già presente resta quella di questo dispositivo); la riserva di questo dispositivo resta com\'è. Il file si rifiuta per intero se contiene anche solo una voce non valida. Il salvataggio sta nel browser di questo dispositivo: esporta ogni tanto (Safari cancella i dati dopo 7 giorni senza visite).' })));
  const ca = h('div', { class: 'card' }, h('h3', { text: 'Azzera' }));
  if (!ui.conferma_azzera) ca.appendChild(h('button', { type: 'button', class: 's', id: 'b-azzera', text: 'Azzera i progressi…', on: { click: () => { ui.conferma_azzera = true; render(); } } }));
  else {
    ca.appendChild(h('p', { id: 'testo-azzera', text: 'Cancella i moduli letti (' + stato.letti.length + '), il registro (' + stato.registro.length + ' voci che verranno perse) e riporta la riserva a 180 s su questo dispositivo? Se non hai esportato, andranno persi.' }));
    ca.appendChild(h('div', { class: 'riga' },
      h('button', { type: 'button', class: 'p', id: 'b-azzera-si', text: 'Sì, azzera', on: { click: azzera } }),
      h('button', { type: 'button', class: 's', text: 'Annulla', on: { click: () => { ui.conferma_azzera = false; render(); } } })));
  }
  m.appendChild(ca);
}

function messaggio(t) { ui.msg = t; render(); window.scrollTo(0, 0); }
function leggiTesto(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = () => rej(fr.error); fr.readAsText(file); }); }

function applicaImport(testo) {
  let o;
  try { o = JSON.parse(testo); } catch (e) { return messaggio('Importazione rifiutata: il contenuto non è un JSON valido.'); }
  const v = L.validaProgresso(o);
  if (!v.ok) return messaggio('Importazione rifiutata: ' + v.errori[0] + '.');
  const r = L.unisci(stato, v);
  stato = r.stato; salva();
  messaggio('Importazione riuscita. Moduli letti aggiunti: ' + r.aggiunti + '; già presenti (ignorati): ' + r.gia_presenti + '. Voci del registro nuove: ' + r.voci_nuove + '; duplicate (ignorate): ' + r.voci_duplicate + '.');
}
async function importaProgressiFile(file) {
  if (!file) return;
  let t; try { t = await leggiTesto(file); } catch (e) { return messaggio('Importazione rifiutata: file non leggibile.'); }
  applicaImport(t);
}
function importaProgressiTesto(t) { if (!t.trim()) return messaggio('Importazione rifiutata: il testo è vuoto.'); applicaImport(t); }
function testoEsportazione() { return JSON.stringify(L.creaEsportazione(stato, new Date().toISOString())); }
function esporta() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  const nome = 'triage_f4d_progressi_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json';
  try {
    const url = URL.createObjectURL(new Blob([testoEsportazione()], { type: 'application/json' }));
    const a = h('a', { href: url, download: nome }); document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    messaggio('File «' + nome + '» creato: controlla la cartella dei download.');
  } catch (e) { messaggio('Non è stato possibile creare il file: usa «Copia testo».'); }
}
async function copiaTesto() {
  const t = testoEsportazione();
  try { await navigator.clipboard.writeText(t); return messaggio('Testo copiato negli appunti. Incollalo in un luogo sicuro.'); } catch (e) { /* ripiego */ }
  try {
    const ta = h('textarea', { style: 'position:fixed;left:0;top:0;opacity:0' }); ta.value = t; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    if (ok) return messaggio('Testo copiato negli appunti.');
  } catch (e) { /* niente */ }
  messaggio('Copia non riuscita: usa «Esporta (.json)».');
}
function azzera() { stato = L.statoVuoto(); ui.conferma_azzera = false; ui.corrente = null; ui.confermaElimina = null; salva(); messaggio('Progressi azzerati.'); }

// ------------------------------------------------------------------ avvio
caricaStato();
render();
})();
</script>
